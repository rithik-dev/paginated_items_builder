name: paginated_items_builder
description: Easier to display items in a list/grid view from your controllers directly or handling state internally with support for pagination.
version: 1.2.5
homepage: https://github.com/rithik-dev/paginated_items_builder
repository: https://github.com/rithik-dev/paginated_items_builder
issue_tracker: https://github.com/rithik-dev/paginated_items_builder/issues
documentation: https://github.com/rithik-dev/paginated_items_builder/blob/master/README.md

# Path must point under screenshots/published/, not screenshots/unpublished/ (see the .pubignore
# in that folder) or any hidden directory: pub.dev builds the search thumbnail and the package page
# gallery from the file it actually receives, and `pub publish --dry-run` does not warn if the path
# resolves locally but is excluded from what gets published — this fails silently.
screenshots:
  - description: 'Shimmer loading animation shown while the first page of items is being fetched.'
    path: screenshots/published/loading_shimmer.webp

topics:
  - flutter
  - widget
  - pagination

environment:
  sdk: ">=3.9.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  shimmer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
